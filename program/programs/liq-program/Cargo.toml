[package]
name = "liq-program"
version = "0.1.0"
description = "LIQ Launchpad - Bonding Curve Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "liq_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = { version = "0.29.0", features = ["token"] }
# Override to avoid getrandom 0.3/wit-bindgen 0.51 (Edition 2024)
solana-program = "=1.16.27"
getrandom = "=0.2.14"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
