name: V3 Build and Deploy LIQ Program

on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI (v1.18.26)
        run: |
          wget -q https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar jxf solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH
          export PATH="$PWD/solana-release/bin:$PATH"
          solana --version

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Remove stale Cargo.lock (nightly v4 lockfile fix)
        working-directory: program
        run: |
          rm -f Cargo.lock
          echo "Cargo.lock removed - will be regenerated by stable Rust"

      - name: Pin Problematic Dependencies (Edition 2024 Fix)
        working-directory: program
        run: |
          # Generate fresh lock with stable Rust first
          cargo generate-lockfile
          # Force versions compatible with SBF toolchain (Edition 2021)
          cargo update -p toml_edit --precise 0.20.7 || true
          cargo update -p blake3 --precise 1.5.1 || true
          cargo update -p toml_parser --precise 1.0.0 || true
          cargo update -p winnow --precise 0.5.40 || true

      - name: Build Program
        working-directory: program
        run: |
          export PATH="/home/runner/work/liq-launchpad/liq-launchpad/solana-release/bin:$PATH"
          cargo build-sbf

      - name: Write deployer keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.DEPLOYER_KEYPAIR }}' > ~/.config/solana/deployer.json
          solana address --keypair ~/.config/solana/deployer.json

      - name: Check Balance
        run: |
          solana balance --keypair ~/.config/solana/deployer.json --url devnet

      - name: Deploy to Devnet
        run: |
          solana program deploy \
            program/target/deploy/liq_program.so \
            --url devnet \
            --keypair ~/.config/solana/deployer.json \
            --commitment confirmed
