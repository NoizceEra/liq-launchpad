name: V4 Build and Deploy LIQ Program

on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: No cargo cache - we need a clean state every time to avoid
      # stale nightly v4 Cargo.lock files from local devs

      - name: Install Solana CLI (v1.18.26)
        run: |
          wget -q https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar jxf solana-release-x86_64-unknown-linux-gnu.tar.bz2
          SOLANA_BIN="$PWD/solana-release/bin"
          echo "$SOLANA_BIN" >> $GITHUB_PATH
          export PATH="$SOLANA_BIN:$PATH"
          solana --version

      - name: Setup Rust 1.79.0 (matches SBF toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.79.0"

      - name: Delete old Cargo.lock and generate fresh one
        working-directory: program
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          head -5 Cargo.lock

      - name: Pin Edition2024-incompatible dependencies
        working-directory: program
        run: |
          # Core chain that needs blocking:
          # solana-program -> cc -> getrandom 0.3 -> wasip2 -> wit-bindgen 0.51 (edition2024)
          # solana-program -> borsh 1.6.1 -> proc-macro-crate 3.5 -> toml_edit 0.25 (edition2024)
          
          # Pin blake3 (direct edition2024 issue)
          cargo update -p blake3 --precise 1.5.1 || echo "blake3 pin skipped (ok)"
          
          # Downgrade getrandom 0.3 -> 0.2 to break the wit-bindgen chain
          cargo update -p getrandom@0.3.4 --precise 0.2.15 || \
            cargo update -p getrandom --precise 0.2.15 || \
            echo "getrandom pin skipped (ok)"
          
          # Downgrade borsh 1.6.1 -> 1.5.0 to use proc-macro-crate 1.x instead of 3.x
          cargo update -p borsh@1.6.1 --precise 1.5.0 || echo "borsh@1 pin skipped (ok)"
          cargo update -p borsh-derive@1.6.1 --precise 1.5.0 || echo "borsh-derive@1 pin skipped (ok)"
          
          # Show result
          cargo tree 2>/dev/null | grep -E "wit-bindgen|toml_edit|getrandom" | sort -u | head -20 || true

      - name: Build Program
        working-directory: program
        run: |
          export PATH="$GITHUB_WORKSPACE/../solana-release/bin:$PATH"
          # Must point to the solana-release we downloaded
          SOLANA_DIR=$(find / -name "cargo-build-sbf" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
          if [ -z "$SOLANA_DIR" ]; then
            # Use the one we downloaded
            export PATH="$(ls -d $GITHUB_WORKSPACE/../solana-release/bin 2>/dev/null || ls -d /home/runner/work/liq-launchpad/liq-launchpad/../solana-release/bin)/.. /bin:$PATH" || true
          fi
          # Find cargo-build-sbf
          CARGO_BUILD_SBF=$(find /home/runner -name "cargo-build-sbf" -type f 2>/dev/null | head -1)
          echo "Found cargo-build-sbf at: $CARGO_BUILD_SBF"
          $CARGO_BUILD_SBF --manifest-path Cargo.toml

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liq_program_so
          path: program/target/deploy/liq_program.so

      - name: Write deployer keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.DEPLOYER_KEYPAIR }}' > ~/.config/solana/deployer.json
          # Verify keypair is readable
          SOLANA_BIN=$(find /home/runner -name "solana" -type f 2>/dev/null | head -1)
          $SOLANA_BIN address --keypair ~/.config/solana/deployer.json

      - name: Check deployer balance
        run: |
          SOLANA_BIN=$(find /home/runner -name "solana" -type f 2>/dev/null | head -1)
          $SOLANA_BIN balance --keypair ~/.config/solana/deployer.json --url devnet

      - name: Deploy to Devnet
        run: |
          SOLANA_BIN=$(find /home/runner -name "solana" -type f 2>/dev/null | head -1)
          $SOLANA_BIN program deploy \
            program/target/deploy/liq_program.so \
            --url devnet \
            --keypair ~/.config/solana/deployer.json \
            --commitment confirmed
