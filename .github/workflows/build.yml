name: Build and Deploy LIQ Program

on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI (Manual Download)
        run: |
          wget -q https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar jxf solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH
          export PATH="$PWD/solana-release/bin:$PATH"
          solana --version

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install anchor-cli (Manual Install for speed or binary)
        run: |
          # Sometimes building anchor-cli takes too long, we use the build directly
          echo "Using cargo to install anchor-cli if needed, but we mostly just need cargo-build-sbf"

      - name: Build Program (Forcing Editions and Path)
        working-directory: program
        run: |
          export PATH="/home/runner/work/liq-launchpad/liq-launchpad/solana-release/bin:$PATH"
          # Try to build with a clean state
          cargo build-sbf

      - name: Get binary size
        working-directory: program
        run: |
          ls -lh target/deploy/liq_program.so
          SIZE=$(stat -c%s target/deploy/liq_program.so)
          echo "EXACT_SIZE=$SIZE bytes"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liq_program_build
          path: program/target/deploy/liq_program.so

      - name: Write deployer keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.DEPLOYER_KEYPAIR }}' > ~/.config/solana/deployer.json
          solana address --keypair ~/.config/solana/deployer.json

      - name: Deploy to Devnet
        run: |
          # Use confirmed commitment for reliability
          solana program deploy \
            program/target/deploy/liq_program.so \
            --url devnet \
            --keypair ~/.config/solana/deployer.json \
            --commitment confirmed
